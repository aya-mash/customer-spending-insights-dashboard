services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: customer-insights-dev
    ports:
      - "5173:5173"
      - "6006:6006"
    volumes:
      # Mount source code for hot reload
      - .:/workspace:cached
      # Use anonymous volumes for node_modules to avoid conflicts
      - /workspace/node_modules
      - /workspace/.yarn
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=/api
      - VITE_APP_NAME=Customer Spending Insights
      - VITE_ENABLE_MOCKS=true
    working_dir: /workspace
    command: sh -c "yarn install && npx msw init public --save && yarn dev:docker"
    # Start as root, then switch to node user after fixing permissions
    user: root
    stdin_open: true
    tty: true

