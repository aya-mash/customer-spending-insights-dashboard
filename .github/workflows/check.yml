name: checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - develop
      - 'release/*'
      - 'hotfix/*'

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Disable shallow clone for better SonarCloud analysis

      - name: Setup Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Initialize MSW
        run: npx msw init public

      - name: Type check
        run: yarn tsc -b

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test --run
