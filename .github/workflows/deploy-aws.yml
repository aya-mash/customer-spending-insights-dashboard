name: deploy

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch: {}

env:
  AWS_REGION: af-south-1

jobs:
  integration:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Sync build to S3 (Integration)
        if: success()
        run: aws s3 sync dist s3://${{ secrets.S3_BUCKET_INT }} --delete

      - name: Invalidate CloudFront (Integration)
        if: success()
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CF_DIST_ID_INT }} --paths '/*'

  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Sync build to S3 (Production)
        if: success()
        run: aws s3 sync dist s3://${{ secrets.S3_BUCKET_PROD }} --delete

      - name: Invalidate CloudFront (Production)
        if: success()
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CF_DIST_ID_PROD }} --paths '/*'
