<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <meta name="theme-color" content="#2F70EF" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>customer-spending-insights-dashboard</title>
  </head>
  <body>
    <script>
      // Pre-hydration theme bootstrap - prevents FOUC
      (function(){
        try {
          var key='theme-choice';
          var stored=localStorage.getItem(key);
          var mode = (stored==='light' || stored==='dark' || stored==='system') ? stored : 'system';
          var effective;
          
          if (mode === 'system') {
            effective = globalThis.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else {
            effective = mode;
          }
          
          var root = document.documentElement;
          root.dataset.theme = effective;  // What's actually applied
          root.dataset.mode = mode;         // User's choice
          root.style.colorScheme = effective;
        } catch(e) {
          console.warn('Theme init failed', e);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
